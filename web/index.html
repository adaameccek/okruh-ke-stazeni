<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Okruh</title>
<meta name="description" content="Kam až dosáhnu: okruh kolem místa v kilometrech i v minutách autem, na kole a pěšky.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="styl.css?v=1">
</head>
<body>
<main id="mapa">
  <canvas id="dlazdice"></canvas>
  <canvas id="vrstva"></canvas>
  <button id="ja" type="button" aria-label="Ukázat moji polohu" title="Moje poloha">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></svg>
  </button>
  <a id="atribuce" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a>
  <div id="bublina" hidden>
    <p id="bublina-text"></p>
    <button id="bublina-okruh" type="button">Okruh sem</button>
  </div>
</main>

<section id="panel" aria-label="Okruhy">
  <div id="pohled-okruhy">
    <nav id="okruhy"></nav>
    <div class="hodnota">
      <input id="cislo" type="text" inputmode="decimal" autocomplete="off" aria-label="Velikost okruhu">
      <div class="jednotky" role="group" aria-label="Jednotka">
        <button type="button" data-jednotka="km">km</button>
        <button type="button" data-jednotka="min">min</button>
      </div>
      <div class="misto">
        <span id="misto-nazev"></span>
      </div>
      <button id="smazat" type="button" aria-label="Smazat okruh" title="Smazat okruh">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13M10 11v5.5M14 11v5.5"/></svg>
      </button>
    </div>
    <input id="posuvnik" type="range" min="0" max="1" step="0.002" aria-label="Velikost okruhu">
    <div id="zpusoby" role="group" aria-label="Způsob cesty"></div>
    <p id="poznamka"></p>
  </div>

  <div id="pohled-pridat" hidden>
    <div class="hledani">
      <input id="hledat" type="search" placeholder="Město nebo adresa" autocomplete="off" aria-label="Hledat místo">
      <button id="zpet" type="button" aria-label="Zavřít">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <ul id="nabidka"></ul>
    <p id="napoveda">Nebo klepni do mapy.</p>
  </div>
</section>

<script type="module" src="app.js?v=1"></script>
</body>
</html>
